<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 270px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #222d32;
      color: #ffffff;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #374850;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .header h2 {
      font-size: 14px;
      margin: 0;
      color: #3c8dbc;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .version {
      font-size: 10px;
      background: #374850;
      padding: 2px 6px;
      border-radius: 4px;
      color: #b8c7ce;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a2226;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .toggle-label {
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #00a65a;
    }
    .status-dot.disabled {
      background-color: #dd4b39;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #4f5b62;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #00a65a;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    .links-list {
      list-style: none;
      padding: 0;
      margin: 10px 0 0 0;
    }
    .links-list li {
      margin-bottom: 6px;
    }
    .links-list a, .links-list button {
      color: #b8c7ce;
      text-decoration: none;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 4px;
      transition: background 0.2s;
      width: 100%;
      box-sizing: border-box;
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .links-list a:hover, .links-list button:hover {
      background: #374850;
      color: #ffffff;
    }
    .coffee-btn {
      background: #ffdd00 !important;
      color: #000000 !important;
      font-weight: bold;
      margin-top: 6px;
    }
    .coffee-btn:hover {
      background: #f1d000 !important;
    }
    .notice {
      font-size: 10px;
      color: #8aa4af;
      border-top: 1px solid #374850;
      padding-top: 8px;
      margin-top: 10px;
      line-height: 1.35;
    }
    .qr-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 99;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .qr-modal img {
      width: 190px;
      border-radius: 8px;
      border: 2px solid #ffffff;
      background: #ffffff;
    }
    .qr-modal button {
      margin-top: 10px;
      background: #dd4b39;
      color: white;
      border: none;
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🚀 DMS Enhancer</h2>
    <span class="version">v1.5.0</span>
  </div>

  <!-- Main Extension Toggle -->
  <div class="toggle-container">
    <div class="toggle-label">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Enabled</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle-extension" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- Dark Mode Toggle -->
  <div class="toggle-container" style="background: #2b3940;">
    <div class="toggle-label" style="color: #00c0ef;">
      🌙 Dark Mode
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle-dark-mode">
      <span class="slider"></span>
    </label>
  </div>

  <ul class="links-list">
    <li>
      <a href="https://dms.dilg.gov.ph" target="_blank">
        🌐 Open DILG DMS Portal
      </a>
    </li>
    <li>
      <a href="https://github.com/lstvelasco/dms-bulk-complete-release" target="_blank">
        ⭐ Star on GitHub
      </a>
    </li>
    <li>
      <a href="https://luisitovelasco.netlify.app/" target="_blank">
        👨‍💻 Developer Profile
      </a>
    </li>
    <li>
      <button id="btn-show-qr">
        📱 InstaPay / GCash QR
      </button>
    </li>
    <li>
      <a href="https://buymeacoffee.com/lstvelasco4" target="_blank" class="coffee-btn">
        ☕ Buy Me a Coffee
      </a>
    </li>
  </ul>

  <div class="notice">
    <strong>Notice:</strong> Intended for internal productivity enhancement. Users remain responsible for verifying document routing compliance.
  </div>

  <div id="qr-modal" class="qr-modal">
    <img src="assets/instapay-qr.png" alt="InstaPay / GCash QR Code">
    <button id="btn-close-qr">Close</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
